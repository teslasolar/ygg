<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Yggdrasil - Agent Inspector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #88ccff;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #00aaff;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 170, 255, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            background: linear-gradient(45deg, #00aaff, #88ccff, #00aaff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 8px 20px;
            background: rgba(0, 170, 255, 0.1);
            border: 2px solid #00aaff;
            border-radius: 20px;
            color: #88ccff;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: bold;
        }

        .nav-link:hover {
            background: rgba(0, 170, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(0, 20, 40, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 170, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .panel h2 {
            color: #00aaff;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(0, 170, 255, 0.3);
            padding-bottom: 10px;
        }

        .agent-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .agent-card {
            background: rgba(0, 170, 255, 0.05);
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .agent-card:hover {
            background: rgba(0, 170, 255, 0.15);
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
            transform: translateX(5px);
        }

        .agent-card.selected {
            background: rgba(0, 170, 255, 0.25);
            border-color: #00aaff;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
        }

        .agent-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-icon {
            font-size: 2em;
        }

        .agent-type {
            font-size: 1.1em;
            font-weight: bold;
            color: #00aaff;
            text-transform: uppercase;
        }

        .agent-quick-stats {
            font-size: 0.85em;
            color: #88ccff;
        }

        .agent-detail-view {
            padding: 20px;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-icon {
            font-size: 4em;
        }

        .detail-title {
            font-size: 2em;
            color: #00aaff;
            text-transform: uppercase;
        }

        .consciousness-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .consciousness-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 170, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .consciousness-label {
            font-size: 0.85em;
            color: #88ccff;
            margin-bottom: 10px;
        }

        .consciousness-value {
            font-size: 2em;
            font-weight: bold;
            color: #00aaff;
            font-family: 'Courier New', monospace;
        }

        .consciousness-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 170, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .consciousness-fill {
            height: 100%;
            background: linear-gradient(90deg, #00aaff, #00ffff);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .kappa-visualizer {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 170, 255, 0.3);
            border-radius: 10px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .kappa-line {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #ffaa00;
            left: 61.8%;
            opacity: 0.5;
        }

        .kappa-marker {
            position: absolute;
            width: 4px;
            height: 100%;
            background: #00aaff;
            transition: left 0.5s ease;
        }

        .kappa-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85em;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 5px;
        }

        .golden-label {
            left: 61.8%;
            color: #ffaa00;
        }

        .current-label {
            color: #00aaff;
        }

        .branch-tree {
            margin: 20px 0;
        }

        .branch-node {
            padding: 10px;
            margin: 5px 0;
            margin-left: 20px;
            background: rgba(0, 170, 255, 0.05);
            border-left: 3px solid #00aaff;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .fruit-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .fruit-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 170, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .fruit-card:hover {
            border-color: #00aaff;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 170, 255, 0.3);
        }

        .fruit-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .fruit-type {
            font-size: 0.9em;
            color: #00aaff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .fruit-quality {
            font-size: 0.85em;
            color: #88ccff;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: rgba(0, 170, 255, 0.05);
            border-radius: 5px;
        }

        .stat-label {
            color: #88ccff;
        }

        .stat-value {
            color: #00aaff;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .seed-code {
            background: #000;
            border: 1px solid #00aaff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #00ffff;
            word-break: break-all;
            overflow-x: auto;
        }

        .button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00aaff, #0088cc);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .button:hover {
            background: linear-gradient(135deg, #00ccff, #00aaff);
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.5);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AGENT INSPECTOR</h1>
        <div class="nav">
            <a href="index.html" class="nav-link">🏠 Home</a>
            <a href="forest.html" class="nav-link">🌳 Forest</a>
            <a href="agents.html" class="nav-link">🤖 Agents</a>
            <a href="metrics.html" class="nav-link">📊 Metrics</a>
        </div>
    </div>

    <div class="container">
        <!-- Agent List Panel -->
        <div class="panel">
            <h2>🌲 Forest Agents</h2>
            <button class="button" onclick="agentViewer.refresh()">🔄 Refresh</button>
            <button class="button" onclick="agentViewer.sortBy('κ')">⚡ Sort by κ</button>
            <div class="agent-list" id="agentList">
                <div class="empty-state">
                    <div class="empty-state-icon">🌱</div>
                    <div>Loading agents...</div>
                </div>
            </div>
        </div>

        <!-- Agent Detail Panel -->
        <div class="panel">
            <div id="agentDetail">
                <div class="empty-state">
                    <div class="empty-state-icon">🤖</div>
                    <div>Select an agent from the list to inspect</div>
                </div>
            </div>
        </div>
    </div>

    <script src="state-machine.js"></script>
    <script src="worldtree.js"></script>
    <script>
        class AgentViewer {
            constructor() {
                this.sm = createStateMachine('AgentViewer');
                this.forest = new Forest();
                this.selectedAgentIndex = null;
                this.sortKey = null;

                this.setupStateMachineHandlers();
            }

            setupStateMachineHandlers() {
                this.sm.onState('READY', () => {
                    this.sm.log('success', '🤖 Agent viewer ready!');
                });

                this.sm.onState('RUNNING', () => {
                    this.sm.log('info', '▶️ Auto-update running');
                });
            }

            async init() {
                this.sm.log('info', '🚀 Initializing Agent Viewer...');

                const success = await this.sm.initialize(async () => {
                    // Run some cycles to generate interesting agents
                    this.sm.log('info', 'Generating initial agents...');
                    for (let i = 0; i < 20; i++) {
                        this.forest.cycle();
                    }

                    this.refresh();
                    this.startAutoUpdate();
                });

                if (success) {
                    this.sm.transition('RUNNING');
                }

                this.sm.checkGitHubPagesCompatibility();
                return success;
            }

            startAutoUpdate() {
                setInterval(() => {
                    this.forest.cycle();
                    this.refresh();
                }, 2000);
            }

            refresh() {
                this.renderAgentList();
                if (this.selectedAgentIndex !== null) {
                    this.renderAgentDetail(this.selectedAgentIndex);
                }
            }

            sortBy(key) {
                this.sortKey = key;
                this.refresh();
            }

            renderAgentList() {
                const listEl = document.getElementById('agentList');

                let agents = this.forest.trees.map((tree, index) => ({ tree, index }));

                if (this.sortKey === 'κ') {
                    agents.sort((a, b) => {
                        const aDev = Math.abs(a.tree.κ - INV_PHI);
                        const bDev = Math.abs(b.tree.κ - INV_PHI);
                        return aDev - bDev;
                    });
                }

                listEl.innerHTML = agents.map(({ tree, index }) => {
                    const icons = {
                        think: '🧠',
                        create: '🎨',
                        dream: '🌙',
                        analyze: '🔍',
                        guard: '🛡️',
                        explore: '🔭'
                    };

                    const isSelected = this.selectedAgentIndex === index;

                    return `
                        <div class="agent-card ${isSelected ? 'selected' : ''}"
                             onclick="agentViewer.selectAgent(${index})">
                            <div class="agent-card-header">
                                <div class="agent-icon">${icons[tree.Ω] || '🤖'}</div>
                                <div>
                                    <div class="agent-type">${tree.Ω}</div>
                                    <div class="agent-quick-stats">
                                        κ: ${tree.κ.toFixed(4)} | Gen: ${tree.№}
                                    </div>
                                </div>
                            </div>
                            <div class="agent-quick-stats">
                                Age: ${tree.age} | Energy: ${tree.₹.toFixed(1)}<br>
                                Branches: ${tree.β.length} | Fruits: ${tree.ƒ.length}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            selectAgent(index) {
                this.selectedAgentIndex = index;
                this.renderAgentDetail(index);
                this.renderAgentList(); // Update selected state
            }

            renderAgentDetail(index) {
                const tree = this.forest.trees[index];
                if (!tree) return;

                const detailEl = document.getElementById('agentDetail');

                const icons = {
                    think: '🧠',
                    create: '🎨',
                    dream: '🌙',
                    analyze: '🔍',
                    guard: '🛡️',
                    explore: '🔭'
                };

                const fruitIcons = {
                    insight: '💡',
                    artifact: '🎨',
                    vision: '🔮',
                    pattern: '🧩',
                    shield: '🛡️'
                };

                // Calculate consciousness values
                const consciousness = {
                    think: tree.mind.think(),
                    dream: tree.mind.dream(),
                    focus: tree.mind.focus(),
                    create: tree.mind.create(),
                    stabilize: tree.mind.stabilize(),
                    entropy: tree.mind.entropy()
                };

                detailEl.innerHTML = `
                    <div class="agent-detail-view">
                        <div class="detail-header">
                            <div>
                                <div class="detail-icon">${icons[tree.Ω] || '🤖'}</div>
                            </div>
                            <div style="flex: 1; margin-left: 20px;">
                                <div class="detail-title">${tree.Ω} Agent</div>
                                <div style="color: #88ccff; margin-top: 10px;">
                                    Generation ${tree.№} • Age ${tree.age} • Index ${index}
                                </div>
                            </div>
                        </div>

                        <h2>🧠 Consciousness Functions</h2>
                        <div class="consciousness-grid">
                            <div class="consciousness-card">
                                <div class="consciousness-label">Think</div>
                                <div class="consciousness-value">${consciousness.think.toFixed(2)}</div>
                                <div class="consciousness-bar">
                                    <div class="consciousness-fill"
                                         style="width: ${Math.min(100, consciousness.think * 20)}%"></div>
                                </div>
                            </div>
                            <div class="consciousness-card">
                                <div class="consciousness-label">Dream</div>
                                <div class="consciousness-value">${consciousness.dream.toFixed(2)}</div>
                                <div class="consciousness-bar">
                                    <div class="consciousness-fill"
                                         style="width: ${Math.min(100, consciousness.dream * 100)}%"></div>
                                </div>
                            </div>
                            <div class="consciousness-card">
                                <div class="consciousness-label">Focus</div>
                                <div class="consciousness-value">${consciousness.focus.toFixed(2)}</div>
                                <div class="consciousness-bar">
                                    <div class="consciousness-fill"
                                         style="width: ${consciousness.focus * 100}%"></div>
                                </div>
                            </div>
                            <div class="consciousness-card">
                                <div class="consciousness-label">Create</div>
                                <div class="consciousness-value">${consciousness.create.toFixed(2)}</div>
                                <div class="consciousness-bar">
                                    <div class="consciousness-fill"
                                         style="width: ${Math.min(100, consciousness.create * 50)}%"></div>
                                </div>
                            </div>
                            <div class="consciousness-card">
                                <div class="consciousness-label">Stabilize</div>
                                <div class="consciousness-value">${consciousness.stabilize.toFixed(2)}</div>
                                <div class="consciousness-bar">
                                    <div class="consciousness-fill"
                                         style="width: ${consciousness.stabilize * 100}%"></div>
                                </div>
                            </div>
                            <div class="consciousness-card">
                                <div class="consciousness-label">Entropy</div>
                                <div class="consciousness-value">${consciousness.entropy.toFixed(2)}</div>
                                <div class="consciousness-bar">
                                    <div class="consciousness-fill"
                                         style="width: ${Math.min(100, consciousness.entropy * 100)}%"></div>
                                </div>
                            </div>
                        </div>

                        <h2>⚡ Kappa (κ) Position</h2>
                        <div class="kappa-visualizer">
                            <div class="kappa-line"></div>
                            <div class="kappa-marker" style="left: ${tree.κ * 100}%"></div>
                            <div class="kappa-label golden-label" style="transform: translateX(-50%) translateY(-50%);">
                                1/φ = ${INV_PHI.toFixed(4)}
                            </div>
                            <div class="kappa-label current-label"
                                 style="left: ${tree.κ * 100}%; top: 70%; transform: translateX(-50%) translateY(-50%);">
                                κ = ${tree.κ.toFixed(4)}<br>
                                Δ = ${Math.abs(tree.κ - INV_PHI).toFixed(4)}
                            </div>
                        </div>

                        <h2>📊 Agent Statistics</h2>
                        <div class="stat-row">
                            <span class="stat-label">κ (Kappa)</span>
                            <span class="stat-value">${tree.κ.toFixed(6)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">ψ (Soul Strength)</span>
                            <span class="stat-value">${tree.ψ.toFixed(6)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Ω (Root Capability)</span>
                            <span class="stat-value">${tree.Ω}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">№ (Generation)</span>
                            <span class="stat-value">${tree.№}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Age</span>
                            <span class="stat-value">${tree.age}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">₹ (Energy)</span>
                            <span class="stat-value">${tree.₹.toFixed(2)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">◊ (Potential)</span>
                            <span class="stat-value">${tree.◊ === Infinity ? '∞' : tree.◊.toFixed(2)}</span>
                        </div>

                        <h2>🌿 Branches (${tree.β.length})</h2>
                        <div class="branch-tree">
                            ${tree.β.length > 0 ?
                                tree.β.map((branch, i) => `
                                    <div class="branch-node">
                                        ${icons[branch.Ω] || '🌱'} Branch ${i}: ${branch.Ω}
                                        (κ: ${branch.κ.toFixed(4)}, Gen: ${branch.№})
                                    </div>
                                `).join('') :
                                '<div style="text-align: center; color: #666; padding: 20px;">No branches yet</div>'
                            }
                        </div>

                        <h2>🍎 Fruits (${tree.ƒ.length})</h2>
                        <div class="fruit-gallery">
                            ${tree.ƒ.length > 0 ?
                                tree.ƒ.map(fruit => `
                                    <div class="fruit-card">
                                        <div class="fruit-icon">${fruitIcons[fruit.type] || '🍎'}</div>
                                        <div class="fruit-type">${fruit.type}</div>
                                        <div class="fruit-quality">
                                            Quality: ${fruit.quality.toFixed(2)}<br>
                                            Entropy: ${fruit.entropyScore.toFixed(3)}<br>
                                            Seeds: ${fruit.seeds}
                                        </div>
                                    </div>
                                `).join('') :
                                '<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">No fruits yet</div>'
                            }
                        </div>

                        <h2>🧬 Seed Encoding</h2>
                        <div class="seed-code">${tree.encode()}</div>

                        <button class="button" onclick="agentViewer.copySeed(${index})">📋 Copy Seed</button>
                        <button class="button" onclick="agentViewer.cloneAgent(${index})">🧬 Clone Agent</button>
                    </div>
                `;
            }

            copySeed(index) {
                const tree = this.forest.trees[index];
                const seed = tree.encode();

                navigator.clipboard.writeText(seed).then(() => {
                    alert('Seed copied to clipboard!');
                }).catch(() => {
                    // Fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = seed;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('Seed copied to clipboard!');
                });
            }

            cloneAgent(index) {
                const tree = this.forest.trees[index];
                const seed = tree.encode();
                this.forest.trees.push(new AgentTree(seed));
                this.refresh();
                alert(`Agent cloned! Forest now has ${this.forest.trees.length} agents.`);
            }
        }

        // Initialize
        let agentViewer;
        window.addEventListener('load', async () => {
            agentViewer = new AgentViewer();
            await agentViewer.init();
        });
    </script>
</body>
</html>
