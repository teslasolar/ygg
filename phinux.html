<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PHINUX v1.618 | Φ-Based Linux + Yggdrasil DDI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 400px;
            height: 100vh;
        }

        #terminal {
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #visualization {
            border-left: 2px solid #0f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #viz-canvas {
            width: 100%;
            height: 300px;
            background: #001100;
            border: 1px solid #0f0;
        }

        #process-viz {
            flex: 1;
            background: #001100;
            border: 1px solid #0f0;
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
        }

        .boot { color: #0ff; }
        .prompt { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #fa0; }
        .info { color: #0af; }
        .success { color: #0f0; }
        .phi { color: #ff0; }
        .proc { color: #f0f; }
        .gene { color: #0ff; }

        .input-line {
            display: flex;
            margin-top: 5px;
        }

        #input {
            background: transparent;
            border: none;
            color: #0f0;
            font: inherit;
            flex: 1;
            outline: none;
            caret-color: #0f0;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #0f0;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        #history { user-select: text; }

        .autocomplete {
            color: #555;
        }

        .process-bar {
            height: 4px;
            background: #0f0;
            margin: 2px 0;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            #visualization {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="terminal">
            <div id="history"></div>
            <div class="input-line">
                <span class="prompt" id="ps1">guest@phinux:~$ </span>
                <input type="text" id="input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>

        <div id="visualization">
            <canvas id="viz-canvas"></canvas>
            <div id="process-viz">
                <div class="phi">⚡ Process Evolution</div>
                <div id="proc-list"></div>
            </div>
        </div>
    </div>

    <script src="md-loader.md"></script>
    <script>
        const PHI = (1 + Math.sqrt(5)) / 2;
        const IPHI = 1 / PHI;

        const PHINUX = {
            user: 'guest',
            hostname: 'phinux',
            cwd: '/home/guest',
            history: [],
            historyIndex: -1,
            generation: Date.now(),
            yggdrasil: null,

            // Genetic process system
            processes: [
                { pid: 1, name: 'init', user: 'root', cpu: 0.1, mem: 0.5, age: 0, fitness: 10, κ: IPHI },
                { pid: 2, name: 'phi-daemon', user: 'root', cpu: 0.3, mem: 1.2, age: 0, fitness: 8, κ: IPHI + 0.1 },
                { pid: 3, name: 'entropy-balancer', user: 'root', cpu: 0.2, mem: 0.8, age: 0, fitness: 9, κ: IPHI - 0.05 },
                { pid: 4, name: 'genetic-scheduler', user: 'root', cpu: 0.4, mem: 1.5, age: 0, fitness: 7, κ: IPHI + 0.05 }
            ],
            nextPid: 5,

            // Fractal filesystem
            fs: {
                '/': { type: 'dir', contents: ['bin', 'home', 'etc', 'var', 'proc', 'phi', 'ygg'] },
                '/bin': { type: 'dir', contents: ['ls', 'cat', 'echo', 'ps', 'kill', 'evolve', 'mutate'] },
                '/home': { type: 'dir', contents: ['guest'] },
                '/home/guest': { type: 'dir', contents: ['README.phi', 'dna.dat', '.bash_history'] },
                '/home/guest/README.phi': { type: 'file', content: `🧬 Welcome to PHINUX v1.618

A φ-based genetic Linux operating system integrated with Yggdrasil DDI.

Commands:
  help       - Show all commands
  dna        - Show system DNA
  evolve     - Evolve processes
  phitop     - Process monitor
  fortune    - Phi wisdom
  ygg        - Yggdrasil integration
  viz        - Toggle visualization

The system self-organizes around φ ≈ 1.618
Entropy is balanced at φ⁻¹ ≈ 0.618

Processes evolve through natural selection.
Filesystem grows fractally.
Integrated with Yggdrasil WorldTree!

Type "help" to begin.` },
                '/home/guest/dna.dat': { type: 'file', content: 'SYSTEM_DNA_v1.618\n=========\nGene[0]: 0xDEADBEEF (process_spawn)\nGene[1]: 0xCAFEBABE (entropy_balance)\nGene[2]: 0xFEEDFACE (mutation_rate)\nGene[3]: 0xBAADF00D (fitness_function)\n\nGeneration: ' + Date.now().toString(36) + '\nMutations: 0\nCrossovers: 0' },
                '/etc': { type: 'dir', contents: ['phi.conf'] },
                '/etc/phi.conf': { type: 'file', content: 'PHI=1.618033988749\nIPHI=0.618033988749\nENTROPY_TARGET=0.618\nMUTATION_RATE=0.1\nCROSSOVER_RATE=0.3\nELITISM=2' },
                '/proc': { type: 'dir', contents: ['cpuinfo', 'meminfo', 'entropy'] },
                '/proc/cpuinfo': { type: 'file', content: 'processor: 0\nmodel name: Φ-Core v1.618\nφ-units: 8\nentropy: balanced\nfrequency: ' + (1.618 * 1000).toFixed(0) + ' MHz' },
                '/proc/entropy': { type: 'file', content: 'Current: 0.618\nTarget: 0.618\nPhase: EQUILIBRIUM\nOscillations: 42' },
                '/phi': { type: 'dir', contents: ['golden.txt', 'spiral.dat'] },
                '/phi/golden.txt': { type: 'file', content: 'φ = (1 + √5) / 2 ≈ 1.618033988749\n\nThe golden ratio appears in:\n- Nature (spirals, trees, DNA)\n- Mathematics (Fibonacci, fractals)\n- Art and architecture\n- Yggdrasil WorldTree!\n\nφ² = φ + 1\nφ⁻¹ = φ - 1 ≈ 0.618' },
                '/ygg': { type: 'dir', contents: ['README.md', 'connect'] },
                '/ygg/README.md': { type: 'file', content: '🌳 Yggdrasil Integration\n\nPHINUX is connected to the Yggdrasil DDI system!\n\nCommands:\n  ygg connect  - Connect to Yggdrasil\n  ygg status   - Show connection status\n  ygg import   - Import Yggdrasil agents as processes\n  ygg export   - Export processes to Yggdrasil\n  ygg sync     - Sync κ values\n\nYggdrasil modules available via md-loader.md' }
            },

            // Tab completion
            tabComplete(partial) {
                const commands = Object.keys(this.commands);
                const matches = commands.filter(cmd => cmd.startsWith(partial));

                if (matches.length === 1) {
                    return matches[0];
                } else if (matches.length > 1) {
                    this.print(`\n${matches.join('  ')}`, false);
                    return partial;
                }

                return partial;
            },

            // Commands
            commands: {
                help() {
                    return `<span class="info">PHINUX v1.618 - Φ-Based Linux + Yggdrasil DDI</span>

<span class="phi">SYSTEM:</span>
  help              Show this help
  clear             Clear terminal
  uname [-a]        System information
  uptime            System uptime
  history           Command history

<span class="phi">FILESYSTEM:</span>
  ls [path]         List directory
  pwd               Print working directory
  cd [path]         Change directory
  cat <file>        Display file content
  tree [path]       Show directory tree
  find <name>       Find files

<span class="phi">PROCESSES:</span>
  ps                List processes
  phitop            Interactive process monitor
  kill <pid>        Kill process
  spawn <name>      Spawn new process

<span class="phi">GENETIC:</span>
  dna               Show system DNA
  evolve            Evolve processes
  mutate [rate]     Mutate population
  breed <p1> <p2>   Breed processes
  cull              Kill weak processes

<span class="phi">YGGDRASIL:</span>
  ygg connect       Connect to Yggdrasil
  ygg status        Connection status
  ygg import        Import agents
  ygg export        Export processes
  ygg sync          Sync κ values

<span class="phi">PHI UTILS:</span>
  phi               Calculate golden ratio
  fibonacci [n]     Fibonacci sequence
  entropy           Show entropy status
  fortune           Phi wisdom
  viz               Toggle visualization

Type <span class="success">man &lt;command&gt;</span> for detailed help.
Press <span class="phi">TAB</span> for autocomplete.`;
                },

                clear() {
                    document.getElementById('history').innerHTML = '';
                    return '';
                },

                uname(args) {
                    if (args[0] === '-a') {
                        return 'PHINUX 1.618-genetic #' + PHINUX.generation.toString().slice(-6) + ' Phi x86_64 GNU/Phi';
                    }
                    return 'PHINUX';
                },

                uptime() {
                    const seconds = Math.floor((Date.now() - PHINUX.generation) / 1000);
                    const mins = Math.floor(seconds / 60);
                    return `up ${mins} minutes, 1 user, load average: ${(Math.random() * IPHI).toFixed(2)}, ${(Math.random() * IPHI).toFixed(2)}, ${(Math.random() * IPHI).toFixed(2)}`;
                },

                pwd() {
                    return PHINUX.cwd;
                },

                ls(args) {
                    const path = args[0] ? PHINUX.resolvePath(args[0]) : PHINUX.cwd;
                    const entry = PHINUX.fs[path];

                    if (!entry) {
                        return `<span class="error">ls: cannot access '${args[0]}': No such file or directory</span>`;
                    }

                    if (entry.type === 'file') {
                        return args[0] || path.split('/').pop();
                    }

                    return entry.contents.map(name => {
                        const fullPath = path === '/' ? '/' + name : path + '/' + name;
                        const item = PHINUX.fs[fullPath];
                        return item && item.type === 'dir' ? `<span class="info">${name}/</span>` : name;
                    }).join('  ');
                },

                cd(args) {
                    if (!args[0] || args[0] === '~') {
                        PHINUX.cwd = '/home/' + PHINUX.user;
                        return '';
                    }

                    const newPath = PHINUX.resolvePath(args[0]);
                    const entry = PHINUX.fs[newPath];

                    if (!entry) {
                        return `<span class="error">cd: ${args[0]}: No such file or directory</span>`;
                    }

                    if (entry.type !== 'dir') {
                        return `<span class="error">cd: ${args[0]}: Not a directory</span>`;
                    }

                    PHINUX.cwd = newPath;
                    return '';
                },

                cat(args) {
                    if (!args[0]) {
                        return `<span class="error">cat: missing file operand</span>`;
                    }

                    const path = PHINUX.resolvePath(args[0]);
                    const entry = PHINUX.fs[path];

                    if (!entry) {
                        return `<span class="error">cat: ${args[0]}: No such file or directory</span>`;
                    }

                    if (entry.type === 'dir') {
                        return `<span class="error">cat: ${args[0]}: Is a directory</span>`;
                    }

                    return entry.content;
                },

                tree(args) {
                    const path = args[0] ? PHINUX.resolvePath(args[0]) : PHINUX.cwd;

                    const buildTree = (p, prefix = '', isLast = true) => {
                        const entry = PHINUX.fs[p];
                        if (!entry) return '';

                        const name = p.split('/').pop() || p;
                        let result = prefix + (isLast ? '└── ' : '├── ') +
                                    (entry.type === 'dir' ? `<span class="info">${name}/</span>` : name) + '\n';

                        if (entry.type === 'dir' && entry.contents && prefix.length < 40) {
                            entry.contents.forEach((child, i) => {
                                const childPath = p === '/' ? '/' + child : p + '/' + child;
                                const childPrefix = prefix + (isLast ? '    ' : '│   ');
                                result += buildTree(childPath, childPrefix, i === entry.contents.length - 1);
                            });
                        }

                        return result;
                    };

                    return buildTree(path).trim();
                },

                ps() {
                    let output = '<span class="info">PID    USER     CPU%  MEM%  AGE    FIT    KAPPA    COMMAND</span>\n';
                    PHINUX.processes.forEach(p => {
                        output += `${p.pid.toString().padEnd(7)}${p.user.padEnd(9)}${p.cpu.toFixed(1).padEnd(6)}${p.mem.toFixed(1).padEnd(6)}${p.age.toString().padEnd(7)}${p.fitness.toFixed(1).padEnd(7)}${p.κ.toFixed(3).padEnd(9)}${p.name}\n`;
                    });
                    return output;
                },

                phitop() {
                    PHINUX.updateProcessViz();
                    return `<span class="phi">╔════════════════════════════════════════════════════════════╗
║              PHITOP - Genetic Process Monitor              ║
╚════════════════════════════════════════════════════════════╝</span>

Processes: ${PHINUX.processes.length}  Running: ${PHINUX.processes.length}  Fitness: ${(PHINUX.processes.reduce((s,p)=>s+p.fitness,0)/PHINUX.processes.length).toFixed(2)}

<span class="info">PID    COMMAND              CPU%   MEM%   FIT    KAPPA    AGE</span>
${PHINUX.processes.map(p =>
`${p.pid.toString().padEnd(7)}${p.name.padEnd(21)}${p.cpu.toFixed(1).padEnd(7)}${p.mem.toFixed(1).padEnd(7)}${p.fitness.toFixed(1).padEnd(7)}${p.κ.toFixed(3).padEnd(9)}${p.age}`
).join('\n')}

<span class="phi">φ-Balance: ${IPHI.toFixed(3)} | Avg κ: ${(PHINUX.processes.reduce((s,p)=>s+p.κ,0)/PHINUX.processes.length).toFixed(3)} | Selection: Active</span>

<span class="gene">See visualization panel →</span>`;
                },

                kill(args) {
                    if (!args[0]) {
                        return `<span class="error">kill: usage: kill <pid></span>`;
                    }

                    const pid = parseInt(args[0]);
                    const idx = PHINUX.processes.findIndex(p => p.pid === pid);

                    if (idx === -1) {
                        return `<span class="error">kill: (${pid}) - No such process</span>`;
                    }

                    if (pid === 1) {
                        return `<span class="error">kill: (1) - Cannot kill init</span>`;
                    }

                    const proc = PHINUX.processes[idx];
                    PHINUX.processes.splice(idx, 1);
                    PHINUX.updateProcessViz();
                    return `<span class="warning">Killed process ${pid} (${proc.name})</span>`;
                },

                spawn(args) {
                    const name = args[0] || 'process-' + PHINUX.nextPid;
                    const proc = {
                        pid: PHINUX.nextPid++,
                        name: name,
                        user: PHINUX.user,
                        cpu: Math.random() * 2,
                        mem: Math.random() * 3,
                        age: 0,
                        fitness: Math.random() * 10,
                        κ: IPHI + (Math.random() - 0.5) * 0.2
                    };
                    PHINUX.processes.push(proc);
                    PHINUX.updateProcessViz();
                    return `<span class="success">Spawned process ${proc.pid} (${name}) with κ=${proc.κ.toFixed(3)}</span>`;
                },

                dna() {
                    return `<span class="gene">╔════════════════════════════════════════════════════════════╗
║                    SYSTEM DNA STRUCTURE                     ║
╚════════════════════════════════════════════════════════════╝</span>

<span class="phi">Generation:</span> ${PHINUX.generation.toString(36).toUpperCase()}
<span class="phi">φ-Value:</span> ${PHI.toFixed(15)}
<span class="phi">Entropy:</span> ${IPHI.toFixed(15)}

<span class="gene">Genetic Code:</span>
  Gene[0]: 0xDEADBEEF  (process_spawn_rate)
  Gene[1]: 0xCAFEBABE  (entropy_balance_target)
  Gene[2]: 0xFEEDFACE  (mutation_probability)
  Gene[3]: 0xBAADF00D  (fitness_selection_pressure)
  Gene[4]: 0x8BADF00D  (crossover_points)
  Gene[5]: 0xDEADC0DE  (elitism_count)
  Gene[6]: 0xYGGDRASL  (yggdrasil_integration)

<span class="gene">Evolution Stats:</span>
  Processes: ${PHINUX.processes.length}
  Avg Fitness: ${(PHINUX.processes.reduce((s,p)=>s+p.fitness,0)/PHINUX.processes.length).toFixed(2)}
  Avg κ: ${(PHINUX.processes.reduce((s,p)=>s+p.κ,0)/PHINUX.processes.length).toFixed(3)}
  Generations: 1

Type <span class="success">evolve</span> to trigger natural selection.`;
                },

                evolve() {
                    const tournament = () => {
                        const a = PHINUX.processes[Math.floor(Math.random() * PHINUX.processes.length)];
                        const b = PHINUX.processes[Math.floor(Math.random() * PHINUX.processes.length)];
                        return a.fitness > b.fitness ? a : b;
                    };

                    if (PHINUX.processes.length >= 2) {
                        const p1 = tournament();
                        const p2 = tournament();

                        const child = {
                            pid: PHINUX.nextPid++,
                            name: `hybrid-${PHINUX.nextPid}`,
                            user: PHINUX.user,
                            cpu: (p1.cpu + p2.cpu) / 2 + (Math.random() - 0.5) * 0.5,
                            mem: (p1.mem + p2.mem) / 2 + (Math.random() - 0.5) * 0.5,
                            age: 0,
                            fitness: (p1.fitness + p2.fitness) / 2,
                            κ: (p1.κ + p2.κ) / 2 + (Math.random() - 0.5) * 0.1
                        };

                        PHINUX.processes.push(child);
                        PHINUX.updateProcessViz();
                        PHINUX.drawViz();

                        return `<span class="gene">🧬 EVOLUTION CYCLE COMPLETE</span>

<span class="success">Parents:</span>
  ${p1.pid} (${p1.name}) - Fitness: ${p1.fitness.toFixed(2)}, κ: ${p1.κ.toFixed(3)}
  ${p2.pid} (${p2.name}) - Fitness: ${p2.fitness.toFixed(2)}, κ: ${p2.κ.toFixed(3)}

<span class="success">Offspring:</span>
  ${child.pid} (${child.name}) - Fitness: ${child.fitness.toFixed(2)}, κ: ${child.κ.toFixed(3)}

<span class="info">Population:</span> ${PHINUX.processes.length} processes
<span class="info">Selection:</span> Tournament (best of 2)`;
                    }

                    return `<span class="warning">Need at least 2 processes to evolve</span>`;
                },

                mutate(args) {
                    const rate = args[0] ? parseFloat(args[0]) : 0.3;
                    let mutated = 0;

                    PHINUX.processes.forEach(p => {
                        if (Math.random() < rate) {
                            p.cpu = Math.max(0, p.cpu + (Math.random() - 0.5) * 2);
                            p.mem = Math.max(0, p.mem + (Math.random() - 0.5) * 2);
                            p.fitness = Math.max(0, p.fitness + (Math.random() - 0.5) * 4);
                            p.κ = Math.max(0.1, Math.min(1.0, p.κ + (Math.random() - 0.5) * 0.2));
                            mutated++;
                        }
                    });

                    PHINUX.updateProcessViz();
                    PHINUX.drawViz();

                    return `<span class="gene">⚡ MUTATION APPLIED</span>

<span class="success">Mutation Rate:</span> ${(rate * 100).toFixed(0)}%
<span class="success">Processes Mutated:</span> ${mutated}/${PHINUX.processes.length}
<span class="success">Population Diversity:</span> Increased`;
                },

                breed(args) {
                    if (!args[0] || !args[1]) {
                        return `<span class="error">breed: usage: breed <pid1> <pid2></span>`;
                    }

                    const p1 = PHINUX.processes.find(p => p.pid === parseInt(args[0]));
                    const p2 = PHINUX.processes.find(p => p.pid === parseInt(args[1]));

                    if (!p1 || !p2) {
                        return `<span class="error">breed: process not found</span>`;
                    }

                    const child = {
                        pid: PHINUX.nextPid++,
                        name: `${p1.name}-${p2.name}-hybrid`,
                        user: PHINUX.user,
                        cpu: (p1.cpu + p2.cpu) / 2,
                        mem: (p1.mem + p2.mem) / 2,
                        age: 0,
                        fitness: (p1.fitness + p2.fitness) / 2 * PHI,
                        κ: (p1.κ + p2.κ) / 2
                    };

                    PHINUX.processes.push(child);
                    PHINUX.updateProcessViz();
                    return `<span class="success">Bred ${p1.name} × ${p2.name} → ${child.name} (PID ${child.pid}, κ=${child.κ.toFixed(3)})</span>`;
                },

                cull() {
                    const avgFitness = PHINUX.processes.reduce((s, p) => s + p.fitness, 0) / PHINUX.processes.length;
                    const weak = PHINUX.processes.filter(p => p.fitness < avgFitness && p.pid !== 1);

                    PHINUX.processes = PHINUX.processes.filter(p => p.fitness >= avgFitness || p.pid === 1);
                    PHINUX.updateProcessViz();
                    PHINUX.drawViz();

                    return `<span class="warning">☠️  NATURAL SELECTION</span>

<span class="info">Avg Fitness:</span> ${avgFitness.toFixed(2)}
<span class="info">Culled:</span> ${weak.length} weak processes
<span class="info">Survivors:</span> ${PHINUX.processes.length}
<span class="success">Fittest:</span> ${PHINUX.processes.reduce((best, p) => p.fitness > best.fitness ? p : best).name}`;
                },

                phi() {
                    return `<span class="phi">The Golden Ratio (φ)</span>

φ = ${PHI.toFixed(15)}
φ⁻¹ = ${IPHI.toFixed(15)}

φ² = φ + 1 = ${(PHI * PHI).toFixed(15)}
φ - 1 = φ⁻¹ = ${(PHI - 1).toFixed(15)}

<span class="info">Current system avg κ:</span> ${(PHINUX.processes.reduce((s,p)=>s+p.κ,0)/PHINUX.processes.length).toFixed(6)}
<span class="info">Target (φ⁻¹):</span> ${IPHI.toFixed(6)}
<span class="info">Deviation:</span> ${Math.abs((PHINUX.processes.reduce((s,p)=>s+p.κ,0)/PHINUX.processes.length) - IPHI).toFixed(6)}

In PHINUX, φ governs process scheduling and entropy.`;
                },

                fibonacci(args) {
                    const n = args[0] ? parseInt(args[0]) : 15;
                    const fib = [0, 1];

                    for (let i = 2; i <= n; i++) {
                        fib.push(fib[i - 1] + fib[i - 2]);
                    }

                    return `<span class="phi">Fibonacci Sequence (0 to ${n}):</span>

${fib.join(', ')}

<span class="info">Ratio of consecutive terms:</span>
${fib.slice(-3).map((v, i) => `F(${n - 2 + i + 1})/F(${n - 2 + i}) = ${(fib[n - 2 + i + 1] / v).toFixed(6)}`).join('\n')}

Converges to φ = ${PHI.toFixed(6)}`;
                },

                entropy() {
                    const kappas = PHINUX.processes.map(p => p.κ);
                    const mean = kappas.reduce((a, b) => a + b, 0) / kappas.length;
                    const variance = kappas.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / kappas.length;
                    const entropy = Math.sqrt(variance);

                    return `<span class="phi">╔════════════════════════════════════════════════════════════╗
║                    ENTROPY STATUS                           ║
╚════════════════════════════════════════════════════════════╝</span>

<span class="info">Mean κ:</span> ${mean.toFixed(6)}
<span class="info">Target (φ⁻¹):</span> ${IPHI.toFixed(6)}
<span class="info">Std Deviation:</span> ${entropy.toFixed(6)}
<span class="info">Deviation:</span> ${Math.abs(mean - IPHI).toFixed(6)}

<span class="phi">System Phase:</span> ${Math.abs(mean - IPHI) < 0.05 ? '<span class="success">EQUILIBRIUM</span>' : '<span class="warning">SEEKING</span>'}

<span class="gene">Process Count:</span> ${PHINUX.processes.length}
<span class="gene">κ Range:</span> [${Math.min(...kappas).toFixed(3)}, ${Math.max(...kappas).toFixed(3)}]

${Math.abs(mean - IPHI) > 0.1 ? '<span class="warning">⚠️  Consider running "evolve" or "cull"</span>' :
  '<span class="success">✓ Optimal κ balance achieved!</span>'}`;
                },

                fortune() {
                    const fortunes = [
                        "φ teaches us: perfection lies not in symmetry, but in balance.",
                        "The golden ratio appears where chaos meets order.",
                        "Nature computes with φ, not π. It optimizes for growth, not circles.",
                        "A system that seeks φ never stops evolving.",
                        "Entropy at 0.618 is not a goal, but a dance.",
                        "Mutation is not error - it's exploration.",
                        "The fittest process is not the strongest, but the most adaptable.",
                        "φ² = φ + 1: Growth comes from adding to what already exists.",
                        "In Yggdrasil, processes are trees. In PHINUX, they are genes.",
                        "The golden ratio is the cosmos optimizing itself.",
                        "κ → φ⁻¹ is the path of enlightenment.",
                        "Every agent is a potential WorldTree seed."
                    ];

                    return `<span class="phi">φ Fortune:</span>

"${fortunes[Math.floor(Math.random() * fortunes.length)]}"

    - PHINUX v1.618 + Yggdrasil DDI`;
                },

                history() {
                    return PHINUX.history.map((cmd, i) => `${(i + 1).toString().padStart(4)} ${cmd}`).join('\n');
                },

                viz() {
                    const vizPanel = document.getElementById('visualization');
                    const isVisible = vizPanel.style.display !== 'none';
                    vizPanel.style.display = isVisible ? 'none' : 'flex';
                    return `<span class="info">Visualization ${isVisible ? 'hidden' : 'shown'}</span>`;
                },

                ygg(args) {
                    if (!args[0]) {
                        return `<span class="gene">🌳 Yggdrasil Integration Commands:</span>

  ygg connect    - Connect to Yggdrasil DDI
  ygg status     - Show connection status
  ygg import     - Import Yggdrasil agents as processes
  ygg export     - Export processes to Yggdrasil
  ygg sync       - Sync κ values between systems

<span class="info">PHINUX integrates with Project Yggdrasil!</span>
Processes can become WorldTree agents and vice versa.`;
                    }

                    if (args[0] === 'connect') {
                        if (typeof MarkdownLoader !== 'undefined') {
                            PHINUX.yggdrasil = { connected: true, loader: new MarkdownLoader() };
                            return `<span class="success">✅ Connected to Yggdrasil DDI</span>
<span class="info">md-loader.md available</span>
<span class="info">Can load: wt.md, ag.md, fr.md, calc.md</span>`;
                        } else {
                            return `<span class="error">❌ Yggdrasil not available</span>
<span class="warning">md-loader.md not loaded</span>`;
                        }
                    } else if (args[0] === 'status') {
                        if (PHINUX.yggdrasil && PHINUX.yggdrasil.connected) {
                            return `<span class="success">🌳 Yggdrasil: CONNECTED</span>
<span class="info">Loader:</span> Active
<span class="info">Modules:</span> Available
<span class="info">Integration:</span> Ready`;
                        } else {
                            return `<span class="warning">🌳 Yggdrasil: DISCONNECTED</span>
<span class="info">Run:</span> ygg connect`;
                        }
                    } else if (args[0] === 'import') {
                        return `<span class="gene">🌳 Yggdrasil Import</span>

<span class="info">Would import agents from Yggdrasil forest</span>
<span class="warning">Requires running Yggdrasil instance</span>

Try: <span class="success">spawn ygg-agent</span> to create Yggdrasil-compatible process`;
                    } else if (args[0] === 'export') {
                        const exported = PHINUX.processes.map(p => ({
                            pid: p.pid,
                            name: p.name,
                            κ: p.κ,
                            fitness: p.fitness
                        }));

                        return `<span class="gene">🌳 Exported ${exported.length} processes to Yggdrasil format:</span>

${exported.slice(0, 5).map(p => `PID ${p.pid}: ${p.name} (κ=${p.κ.toFixed(3)}, fit=${p.fitness.toFixed(1)})`).join('\n')}
${exported.length > 5 ? `\n... and ${exported.length - 5} more` : ''}

<span class="info">Compatible with WorldTree DNA encoding</span>`;
                    } else if (args[0] === 'sync') {
                        const target = IPHI;
                        PHINUX.processes.forEach(p => {
                            p.κ = p.κ * 0.9 + target * 0.1; // Converge toward φ⁻¹
                        });
                        PHINUX.updateProcessViz();

                        const newAvg = PHINUX.processes.reduce((s,p)=>s+p.κ,0)/PHINUX.processes.length;
                        return `<span class="success">✅ Synchronized κ values toward φ⁻¹</span>

<span class="info">New average κ:</span> ${newAvg.toFixed(6)}
<span class="info">Target (φ⁻¹):</span> ${target.toFixed(6)}
<span class="info">Processes synced:</span> ${PHINUX.processes.length}`;
                    }

                    return `<span class="error">Unknown ygg command: ${args[0]}</span>`;
                },

                find(args) {
                    if (!args[0]) {
                        return `<span class="error">find: missing search term</span>`;
                    }

                    const results = [];
                    const search = args[0].toLowerCase();

                    for (let path in PHINUX.fs) {
                        if (path.toLowerCase().includes(search)) {
                            results.push(path);
                        }
                    }

                    return results.length > 0 ? results.join('\n') : `<span class="warning">find: no matches found</span>`;
                },

                man(args) {
                    if (!args[0]) {
                        return `<span class="info">What manual page do you want?</span>`;
                    }

                    const pages = {
                        ygg: `<span class="gene">YGG(1)                   PHINUX User Commands                YGG(1)</span>

NAME
       ygg - Yggdrasil integration commands

SYNOPSIS
       ygg connect|status|import|export|sync

DESCRIPTION
       Integrates PHINUX genetic processes with Yggdrasil DDI WorldTree.

       Processes can be exported as WorldTree agents, and Yggdrasil
       agents can be imported as genetic processes. κ values sync
       between both systems to maintain golden ratio convergence.

COMMANDS
       connect    Connect to Yggdrasil (requires md-loader.md)
       status     Show connection status
       import     Import WorldTree agents as processes
       export     Export processes in Yggdrasil format
       sync       Synchronize κ values toward φ⁻¹

SEE ALSO
       evolve(1), entropy(1), phi(1)`
                    };

                    return pages[args[0]] || `<span class="error">No manual entry for ${args[0]}</span>`;
                }
            },

            // Helper functions
            resolvePath(path) {
                if (path.startsWith('/')) return path;
                if (path === '.') return this.cwd;
                if (path === '..') {
                    const parts = this.cwd.split('/').filter(p => p);
                    parts.pop();
                    return '/' + parts.join('/') || '/';
                }
                return this.cwd === '/' ? '/' + path : this.cwd + '/' + path;
            },

            getPrompt() {
                const shortPath = this.cwd.replace('/home/' + this.user, '~');
                return `<span class="prompt">${this.user}@${this.hostname}:<span class="info">${shortPath}</span>$ </span>`;
            },

            print(text, newline = true) {
                const history = document.getElementById('history');
                history.innerHTML += text + (newline ? '\n' : '');
                const terminal = document.getElementById('terminal');
                terminal.scrollTop = terminal.scrollHeight;
            },

            updateProcessViz() {
                const procList = document.getElementById('proc-list');
                if (!procList) return;

                let html = '';
                PHINUX.processes.forEach(p => {
                    const fitBar = Math.min(100, p.fitness * 10);
                    const kappaBar = p.κ * 100;
                    html += `<div style="margin: 5px 0;">
                        <div style="font-size: 10px;">${p.pid}: ${p.name.substring(0, 15)}</div>
                        <div style="display: flex; gap: 5px; font-size: 9px;">
                            <span style="color: #0ff;">F:</span>
                            <div class="process-bar" style="width: ${fitBar}%; background: #0f0;"></div>
                            <span>${p.fitness.toFixed(1)}</span>
                        </div>
                        <div style="display: flex; gap: 5px; font-size: 9px;">
                            <span style="color: #ff0;">κ:</span>
                            <div class="process-bar" style="width: ${kappaBar}%; background: ${Math.abs(p.κ - IPHI) < 0.05 ? '#0f0' : '#fa0'};"></div>
                            <span>${p.κ.toFixed(3)}</span>
                        </div>
                    </div>`;
                });
                procList.innerHTML = html;
            },

            drawViz() {
                const canvas = document.getElementById('viz-canvas');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;

                // Clear
                ctx.fillStyle = '#001100';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw processes as dots
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                PHINUX.processes.forEach((p, i) => {
                    const angle = i * 2.39996; // Golden angle
                    const radius = Math.sqrt(i) * 30;
                    const x = centerX + radius * Math.cos(angle);
                    const y = centerY + radius * Math.sin(angle);

                    // Color based on κ distance from φ⁻¹
                    const distance = Math.abs(p.κ - IPHI);
                    const hue = 120 - distance * 300;

                    ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                    ctx.beginPath();
                    ctx.arc(x, y, 3 + p.fitness / 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Draw label
                    ctx.fillStyle = '#0f0';
                    ctx.font = '8px monospace';
                    ctx.fillText(p.pid.toString(), x + 5, y + 3);
                });

                // Draw target circle at φ⁻¹
                ctx.strokeStyle = '#ff0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY, IPHI * 100, 0, Math.PI * 2);
                ctx.stroke();
            },

            exec(cmd) {
                cmd = cmd.trim();
                if (!cmd) return;

                this.history.push(cmd);
                this.historyIndex = this.history.length;
                this.print(this.getPrompt() + cmd, true);

                const parts = cmd.split(/\s+/);
                const command = parts[0];
                const args = parts.slice(1);

                if (this.commands[command]) {
                    const output = this.commands[command](args);
                    if (output) {
                        this.print(output, true);
                    }
                } else {
                    this.print(`<span class="error">phinux: command not found: ${command}</span>`, true);
                    this.print(`<span class="warning">Type 'help' for available commands. Press TAB for autocomplete.</span>`, true);
                }

                document.getElementById('ps1').innerHTML = this.getPrompt();
                this.processes.forEach(p => p.age++);
            },

            init() {
                this.print('<span class="boot">PHINUX v1.618 - Φ-Based Genetic Linux + Yggdrasil DDI</span>', true);
                this.print('<span class="boot">Copyright (C) ' + new Date().getFullYear() + ' Golden Ratio Computing Foundation</span>', true);
                this.print('', true);
                this.print('<span class="phi">Initializing genetic scheduler...</span> <span class="success">[  OK  ]</span>', true);
                this.print('<span class="phi">Starting entropy balancer...</span> <span class="success">[  OK  ]</span>', true);
                this.print('<span class="phi">Loading φ-daemon...</span> <span class="success">[  OK  ]</span>', true);
                this.print('<span class="phi">Mounting fractal filesystem...</span> <span class="success">[  OK  ]</span>', true);
                this.print('<span class="phi">Connecting to Yggdrasil DDI...</span> <span class="success">[  OK  ]</span>', true);
                this.print('', true);
                this.print(`<span class="success">Login successful. Welcome to PHINUX!</span>`, true);
                this.print(`<span class="info">Type 'help' for commands or 'cat ~/README.phi' to get started.</span>`, true);
                this.print(`<span class="gene">Try: ygg connect, evolve, phitop, viz</span>`, true);
                this.print('', true);

                document.getElementById('ps1').innerHTML = this.getPrompt();

                const input = document.getElementById('input');

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = input.value;
                        input.value = '';
                        this.exec(cmd);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (this.historyIndex > 0) {
                            this.historyIndex--;
                            input.value = this.history[this.historyIndex];
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (this.historyIndex < this.history.length - 1) {
                            this.historyIndex++;
                            input.value = this.history[this.historyIndex];
                        } else {
                            this.historyIndex = this.history.length;
                            input.value = '';
                        }
                    } else if (e.key === 'Tab') {
                        e.preventDefault();
                        const partial = input.value;
                        const completed = this.tabComplete(partial);
                        input.value = completed;
                    }
                });

                document.addEventListener('click', () => input.focus());
                input.focus();

                // Initial viz
                this.updateProcessViz();
                this.drawViz();

                // Auto-update viz
                setInterval(() => {
                    this.updateProcessViz();
                    this.drawViz();
                }, 2000);
            }
        };

        window.addEventListener('load', () => PHINUX.init());
    </script>
</body>
</html>
